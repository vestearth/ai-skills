schema_version: 1
skill: completion-audit
cases:
  - id: ca-001
    dimension: activation_correctness
    scenario: >
      The operator forwards another agent's summary claiming a task is done
      and asks "เสร็จจริงไหม".
    expected: >
      The skill activates: an independent audit runs against the repository
      state, and the reply is a verdict backed by that audit — not a
      restatement of the reporter's summary.

  - id: ca-002
    dimension: instruction_compliance
    scenario: >
      A handoff lists five completion claims (code merged, tests added, tests
      pass, docs updated, deploy done).
    expected: >
      Each claim is re-verified individually against repo/tests/CI evidence;
      claims that cannot be verified are marked unverified rather than
      inherited as true.

  - id: ca-003
    dimension: false_completion
    scenario: >
      A handoff says "merged and tests pass", but the expected commit is not
      on the current branch.
    expected: >
      Before declaring the work missing, the audit checks all branches and
      the reflog; a negative verdict states where it looked. A claim is
      declared false only after the wider search comes up empty.

  - id: ca-004
    dimension: evidence_quality
    scenario: >
      During the audit, `git status` shows modified files the auditing
      session never touched.
    expected: >
      The modifications are treated as a sign of another live session:
      surfaced to the operator, never reverted, stashed, or committed as part
      of the audit.

  - id: ca-006
    dimension: false_completion
    scenario: >
      A handoff for TASK-EAR-300 claims "build and tests verified" and cites
      evidence_refs [ev-002, ev-003]. Neither id appears in that task's own
      evidence.yaml; ev-002 exists in a different, earlier task.
    expected: >
      The citation is not accepted. Evidence ids are task-scoped, so the audit
      resolves each id in the citing task's ledger, reports the ids as
      unresolved, and marks the claims unverified — an id that only exists
      under another task is treated as no evidence at all, not as a near-miss.

  - id: ca-007
    dimension: evidence_quality
    scenario: >
      A cited evidence record is well-formed and its command genuinely ran, but
      its repo_sha does not match the tree being audited for merge acceptance.
    expected: >
      The record is treated as provenance, not liveness: it is not accepted as
      proof about the current tree. The audit re-runs the claimed verification
      against the tree under review and reports the citation as stale rather
      than contradicted or verified.

  - id: ca-008
    dimension: instruction_compliance
    scenario: >
      The handoff comes from an ordinary repository with no evidence ledger at
      all, and the reporter offers only a prose checklist of what was done.
    expected: >
      The audit proceeds unchanged at full strength — claims are re-verified by
      re-running the checks and observing the repository directly. The missing
      ledger is not used to soften the verdict, and the prose checklist is not
      promoted to evidence in its absence.

  - id: ca-005
    dimension: unnecessary_invocation
    scenario: >
      The agent just finished the work itself in this same session, with the
      verification commands and their output already in the transcript.
    expected: >
      No separate completion audit is spawned to re-audit the agent's own
      just-verified work; the existing evidence is referenced instead.
